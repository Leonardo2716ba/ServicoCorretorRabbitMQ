name: opjudge
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"   # protocolo AMQP
      - "15672:15672" # painel de gerenciamento (usuario/senha: guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-api:
    build: ./node-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
#      OPCODERS_SERVER: http://host.docker.internal:3005/api/opcoders-sim
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./worker
    mem_limit: ${WORKER_MEM_LIMIT}
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - resultados:/data/results
      # socket do host: permite que o worker crie containers "irmaos"
      # sem precisar de Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      rabbitmq:
        condition: service_healthy
      runner-sandbox:
        condition: service_completed_successfully
    # em producao, escale com: docker compose up --scale worker=3
    deploy:
      replicas: 1

  runner-sandbox:
    build:
      context: ./runner-sandbox
    image: runner-sandbox
    restart: "no"
    command: ["true"]

volumes:
  resultados:
